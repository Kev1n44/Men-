<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro menú</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🥐 NUESTRO MENÚ 🍹</h1>
    <div class="meditation">
      <img src="Med1.png" alt="Meditando" class="meditation-img">
      <div class="planets-orbit">
        <img src="P1.png" alt="P1" class="planet" data-popup="1">
        <img src="P2.png" alt="P2" class="planet" data-popup="2">
        <img src="P3.png" alt="P3" class="planet" data-popup="3">
        <img src="P4.png" alt="P4" class="planet" data-popup="4">
        <img src="P5.png" alt="P5" class="planet" data-popup="5">
        <img src="P6.png" alt="P6" class="planet" data-popup="6">
        <img src="P7.png" alt="P7" class="planet" data-popup="7">
      </div>
    </div>

    <div class="menu-actions">
      <button type="button" id="btn-adiciones" class="btn-adiciones">Adiciones</button>
      <button type="button" id="btn-instructivos" class="btn-adiciones">Instructivos</button>
    </div>
    <p id="menu-sync-status" class="menu-sync-status"></p>
  </div>

  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <h2 id="popup-title"></h2>
      <p id="popup-text"></p>
      <div id="sudoku-container" class="hidden"></div>
      <div id="instructivos-lista" class="instructivos-lista hidden"></div>
      <iframe id="instructivo-frame" class="instructivo-frame hidden" title="Instructivo del juego"></iframe>
      <div class="popup-actions">
        <button type="button" id="instructivo-volver" class="hidden">Volver</button>
        <button id="popup-close">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
